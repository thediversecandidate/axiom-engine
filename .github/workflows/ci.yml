name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: CI image (pinned apt snapshot)
    runs-on: ubuntu-26.04
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: image
        name: Build or reuse the CI image, publish to GHCR, output its digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(cat ci/Dockerfile ci/packages.txt scripts/requirements.txt | sha256sum | cut -c1-16)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/axiom-ci"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker pull "$image:$tag" > /dev/null 2>&1; then
            docker build -t "$image:$tag" -f ci/Dockerfile .
            docker push "$image:$tag"
          fi
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          docker run --rm "$image:$tag" cat /opt/axiom-ci/packages.lock > packages.lock
          echo "CI image: $ref"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-lock
          path: packages.lock

  build:
    name: build + test (${{ matrix.preset }})
    needs: image
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan-ubsan, release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure (first configure in the image, empty dependency cache)
        run: python3 scripts/run_quiet.py --timeout 1800 -- cmake --preset ${{ matrix.preset }}
      - name: Build
        run: python3 scripts/run_quiet.py --timeout 3600 -- cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: python3 scripts/run_quiet.py --timeout 1800 -- ctest --preset ${{ matrix.preset }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.preset }}
          path: build/logs/

  checks:
    name: checkers, self-tests, format, headless Vulkan
    needs: image
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Definition-of-Done checks
        run: python3 scripts/check_all.py
      - name: Lavapipe + validation layer
        run: python3 scripts/check_vulkan_ci.py
