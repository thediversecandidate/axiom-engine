name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: CI image (pinned apt snapshot)
    runs-on: ubuntu-26.04
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: image
        name: Build or reuse the CI image, publish to GHCR, output its digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_annotate.py "CI image" image.log -- bash ci/build_image.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: packages-lock
          path: packages.lock

  build:
    name: build + test (${{ matrix.preset }})
    needs: image
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan-ubsan, release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Configure (first configure in the image, empty dependency cache)
        run: python3 scripts/ci_annotate.py "configure ${{ matrix.preset }}" configure.log -- python3 scripts/run_quiet.py --timeout 1800 -- cmake --preset ${{ matrix.preset }}
      - name: Build
        run: python3 scripts/ci_annotate.py "build ${{ matrix.preset }}" build.log -- python3 scripts/run_quiet.py --timeout 3600 -- cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: python3 scripts/ci_annotate.py "test ${{ matrix.preset }}" test.log -- python3 scripts/run_quiet.py --timeout 1800 -- ctest --preset ${{ matrix.preset }}
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: logs-${{ matrix.preset }}
          path: build/logs/
      - name: Convert test images to PNG
        if: failure()
        run: python3 scripts/pam_to_png.py build/${{ matrix.preset }}/test_output tests/golden
      - if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-images-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/test_output/*.png
            tests/golden/*.png
          if-no-files-found: warn

  checks:
    name: checkers, self-tests, format, headless Vulkan
    needs: image
    runs-on: ubuntu-26.04
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Definition-of-Done checks
        run: python3 scripts/ci_annotate.py "check_all" check_all.log -- python3 scripts/check_all.py
      - name: Lavapipe + validation layer
        run: python3 scripts/ci_annotate.py "vulkan" vulkan.log -- python3 scripts/check_vulkan_ci.py
